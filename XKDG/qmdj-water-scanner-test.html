<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QMDJ Water Scanner — Test Page</title>
  <style>
    body { 
      margin: 0; padding: 16px; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f5;
    }
    #scanner-root { max-width: 480px; margin: 0 auto; }
    .test-header { text-align: center; margin-bottom: 16px; }
    .test-header h1 { font-size: 20px; margin: 0; }
    .test-header p { font-size: 13px; color: #888; margin: 4px 0 0; }
  </style>
</head>
<body>

  <div class="test-header">
    <h1>QMDJ Water Scanner Test</h1>
    <p>Standalone test — verifica che funzioni prima di integrare nell'app</p>
  </div>

  <div id="scanner-root"></div>

  <!-- 1. Load lunar-javascript from CDN (same CDN used in the main app) -->
  <script src="https://cdn.jsdelivr.net/npm/lunar-javascript@1.6.12/lunar.min.js"></script>

  <!-- 2. Load the Water Scanner module -->
  <script src="qmdj-water-scanner.js"></script>

  <!-- 3. Mount the scanner -->
  <script>
    // Verify lunar-javascript loaded correctly
    if(typeof Solar !== 'undefined'){
      console.log('✅ lunar-javascript loaded');
      console.log('   Test: Solar.fromYmd(2026,5,17) =', Solar.fromYmd(2026,5,17).toString());
    } else {
      console.error('❌ lunar-javascript NOT loaded');
      document.getElementById('scanner-root').innerHTML = 
        '<p style="color:red;">lunar-javascript failed to load from CDN</p>';
    }

    // Mount the scanner
    QMDJWaterScanner.mount(document.getElementById('scanner-root'));
  </script>

</body>
</html>
