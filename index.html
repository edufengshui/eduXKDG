<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>XKDG Bazi Calculator - True Solar Time</title>
    <script src="https://cdn.jsdelivr.net/npm/lunar-javascript/lunar.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&display=swap');
        :root { --wood: #1a8a1a; --fire: #d40000; --earth: #8b5a2b; --metal: #555; --water: #0000cd; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f0f0; display: flex; justify-content: center; padding: 20px; }
        .container { background: white; padding: 20px; border-radius: 8px; width: 100%; max-width: 850px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: flex; flex-direction: column; }
        
        .inputs-row { display: flex; gap: 10px; margin-bottom: 15px; justify-content: center; align-items: center; flex-wrap: wrap; }
        
        .geo-row { 
            display: flex; 
            gap: 20px; 
            margin-bottom: 25px; 
            justify-content: center; 
            align-items: center; 
            background: #fdfdfd; 
            padding: 12px; 
            border-radius: 4px; 
            border: 1px solid #eee;
            width: auto;
            align-self: center;
        }
        
        input, button { padding: 8px 12px; border-radius: 4px; border: 1px solid #ccc; font-size: 14px; }
        label { font-size: 12px; font-weight: bold; color: #666; margin-right: 5px; }
        
        .btn-calc { background: #2d2d2d; color: white; cursor: pointer; border: none; font-weight: bold; padding: 8px 25px; }
        .btn-calc:hover { background: #000; }
        .btn-tool { background: #f0f0f0; color: #333; cursor: pointer; border: 1px solid #bbb; font-weight: 600; }

        .chart { display: grid; grid-template-columns: repeat(4, 1fr); border: 2px solid #bbb; background: #fff; }
        .pillar { display: flex; flex-direction: column; border-right: 2px solid #bbb; text-align: center; }
        .pillar:last-child { border-right: none; }
        
        .header { background: #fce4ec; padding: 12px; font-weight: bold; color: #880e4f; border-bottom: 2px solid #bbb; letter-spacing: 1px; }
        .cell { padding: 15px 5px; min-height: 100px; }
        .hanzi { font-family: 'Ma Shan Zheng', cursive; font-size: 64px; line-height: 1.1; display: block; }
        .element-label { font-size: 11px; text-transform: uppercase; opacity: 0.7; font-weight: bold; margin-top: 5px; display: block;}
        
        .hex-section { padding: 20px 5px; border-top: 2px solid #bbb; display: flex; flex-direction: column; align-items: center; min-height: 150px; }
        .hex-wrapper { display: flex; align-items: center; justify-content: center; gap: 10px; margin-left: 20px; }
        .hex-icon { font-size: 80px; color: #000; line-height: 1; }
        .data-column { display: flex; flex-direction: column; justify-content: space-around; height: 80px; width: 35px; font-weight: bold; font-size: 16px; }
        .hex-info { margin-top: 10px; font-size: 13px; font-weight: bold; color: #333; text-align: center; }

        /* Analysis section */
        .analysis-section {
            margin-top: 20px;
            padding: 15px;
            background: #fffbf0;
            border: 1px solid #ffe0a0;
            border-radius: 6px;
            font-size: 13px;
            display: none;
        }
        .analysis-section h3 { margin: 0 0 10px; color: #8b5a2b; font-size: 14px; letter-spacing: 1px; }
        .analysis-item { padding: 4px 0; color: #333; border-bottom: 1px solid #f0e0c0; }
        .analysis-item:last-child { border-bottom: none; }
        
        .wood { color: var(--wood); } .fire { color: var(--fire); } .earth { color: var(--earth); }
        .metal { color: var(--metal); } .water { color: var(--water); }
        
        .solar-badge { background: #fff1f0; color: #d40000; padding: 4px 10px; border-radius: 15px; border: 1px solid #ffa39e; font-size: 13px; font-weight: bold; }

        .hex-missing { font-size: 12px; color: #aaa; margin-top: 20px; }
    </style>
</head>
<body>

<div class="container">
    <div class="inputs-row">
        <button class="btn-tool" onclick="setNow()">NOW</button>
        <button class="btn-tool" onclick="getGPS()">GPS</button>
        <input type="date" id="date">
        <input type="time" id="time">
        <button class="btn-calc" onclick="calculateBazi()">CALCULATE</button>
    </div>

    <div class="geo-row">
        <div>
            <label>UTC OFFSET:</label>
            <input type="number" id="utc-offset" value="1" step="1" style="width: 55px;">
        </div>
        <div>
            <label>LONGITUDE:</label>
            <input type="number" id="longitude" value="12.49" step="0.01" style="width: 85px;">
        </div>
        <div id="solar-time-display" class="solar-badge">True Solar: --:--</div>
    </div>

    <div class="chart">
        <div class="pillar" id="p-hour"><div class="header">HOUR</div><div class="cell stem"></div><div class="cell branch"></div><div class="hex-section"></div></div>
        <div class="pillar" id="p-day"><div class="header">DAY</div><div class="cell stem"></div><div class="cell branch"></div><div class="hex-section"></div></div>
        <div class="pillar" id="p-month"><div class="header">MONTH</div><div class="cell stem"></div><div class="cell branch"></div><div class="hex-section"></div></div>
        <div class="pillar" id="p-year"><div class="header">YEAR</div><div class="cell stem"></div><div class="cell branch"></div><div class="hex-section"></div></div>
    </div>

    <div class="analysis-section" id="analysis-section">
        <h3>⬡ XKDG RELAZIONI (DAY MASTER)</h3>
        <div id="analysis-items"></div>
    </div>
</div>

<script>
// ─────────────────────────────────────────────
//  XKDG DATA (from xkdg_hex.js)
// ─────────────────────────────────────────────
const XKDG_TABLE = {
    '甲子': { hex: 2,  qi: 1, yun: 1 }, '乙丑': { hex: 21, qi: 3, yun: 6 },
    '丙寅': { hex: 37, qi: 2, yun: 4 }, '丁卯': { hex: 41, qi: 6, yun: 9 },
    '戊辰': { hex: 10, qi: 9, yun: 6 }, '己巳': { hex: 34, qi: 8, yun: 2 },
    '庚午': { hex: 32, qi: 8, yun: 9 }, '辛未': { hex: 6,  qi: 9, yun: 3 },
    '壬申': { hex: 7,  qi: 1, yun: 7 }, '癸酉': { hex: 53, qi: 2, yun: 7 },
    '甲戌': { hex: 39, qi: 7, yun: 2 }, '乙亥': { hex: 35, qi: 3, yun: 3 },
    '丙子': { hex: 27, qi: 6, yun: 3 }, '丁丑': { hex: 17, qi: 4, yun: 7 },
    '戊寅': { hex: 55, qi: 8, yun: 6 }, '己卯': { hex: 60, qi: 7, yun: 7 },
    '庚辰': { hex: 11, qi: 1, yun: 9 }, '辛巳': { hex: 14, qi: 3, yun: 7 },
    '壬午': { hex: 57, qi: 2, yun: 1 }, '癸未': { hex: 48, qi: 4, yun: 6 },
    '甲申': { hex: 64, qi: 3, yun: 9 }, '乙酉': { hex: 33, qi: 9, yun: 4 },
    '丙戌': { hex: 52, qi: 6, yun: 1 }, '丁亥': { hex: 16, qi: 8, yun: 8 },
    '戊子': { hex: 3,  qi: 7, yun: 4 }, '己丑': { hex: 25, qi: 9, yun: 2 },
    '庚寅': { hex: 49, qi: 3, yun: 2 }, '辛卯': { hex: 61, qi: 2, yun: 3 },
    '壬辰': { hex: 26, qi: 6, yun: 4 }, '癸巳': { hex: 43, qi: 4, yun: 6 },
    '甲午': { hex: 1,  qi: 9, yun: 1 }, '乙未': { hex: 38, qi: 7, yun: 6 },
    '丙申': { hex: 40, qi: 8, yun: 4 }, '丁酉': { hex: 31, qi: 4, yun: 9 },
    '戊戌': { hex: 15, qi: 1, yun: 6 }, '己亥': { hex: 20, qi: 2, yun: 2 },
    '庚子': { hex: 42, qi: 2, yun: 9 }, '辛丑': { hex: 36, qi: 1, yun: 3 },
    '壬寅': { hex: 13, qi: 9, yun: 7 }, '癸卯': { hex: 54, qi: 8, yun: 7 },
    '甲辰': { hex: 38, qi: 3, yun: 6 }, '乙巳': { hex: 5,  qi: 7, yun: 3 },
    '丙午': { hex: 28, qi: 4, yun: 3 }, '丁未': { hex: 18, qi: 6, yun: 7 },
    '戊申': { hex: 59, qi: 2, yun: 6 }, '己酉': { hex: 56, qi: 3, yun: 8 },
    '庚戌': { hex: 12, qi: 9, yun: 9 }, '辛亥': { hex: 8,  qi: 7, yun: 7 },
    '壬子': { hex: 51, qi: 8, yun: 1 }, '癸丑': { hex: 22, qi: 6, yun: 8 },
    '甲寅': { hex: 63, qi: 7, yun: 9 }, '乙卯': { hex: 19, qi: 1, yun: 4 },
    '丙辰': { hex: 58, qi: 4, yun: 1 }, '丁巳': { hex: 9,  qi: 2, yun: 8 },
    '戊午': { hex: 50, qi: 3, yun: 4 }, '己未': { hex: 46, qi: 1, yun: 2 },
    '庚申': { hex: 4,  qi: 7, yun: 2 }, '辛酉': { hex: 62, qi: 8, yun: 3 },
    '壬戌': { hex: 45, qi: 4, yun: 4 }, '癸亥': { hex: 23, qi: 6, yun: 6 }
};

// I Ching hexagram names (1-64)
const HEX_NAMES = {
    1:'Qian',2:'Kun',3:'Zhun',4:'Meng',5:'Xu',6:'Song',7:'Shi',8:'Bi',
    9:'Xiao Chu',10:'Lü',11:'Tai',12:'Pi',13:'Tong Ren',14:'Da You',15:'Qian',16:'Yu',
    17:'Sui',18:'Gu',19:'Lin',20:'Guan',21:'Shi He',22:'Bi',23:'Bo',24:'Fu',
    25:'Wu Wang',26:'Da Chu',27:'Yi',28:'Da Guo',29:'Kan',30:'Li',31:'Xian',32:'Heng',
    33:'Dun',34:'Da Zhuang',35:'Jin',36:'Ming Yi',37:'Jia Ren',38:'Kui',39:'Jian',40:'Jie',
    41:'Sun',42:'Yi',43:'Guai',44:'Gou',45:'Cui',46:'Sheng',47:'Kun',48:'Jing',
    49:'Ge',50:'Ding',51:'Zhen',52:'Gen',53:'Jian',54:'Gui Mei',55:'Feng',56:'Lü',
    57:'Xun',58:'Dui',59:'Huan',60:'Jie',61:'Zhong Fu',62:'Xiao Guo',63:'Ji Ji',64:'Wei Ji'
};

function getHexIcon(n) {
    return String.fromCodePoint(0x4DC0 + n - 1);
}

function getXkdgData(stem, branch) {
    return XKDG_TABLE[stem + branch] || null;
}

function analyzeXkdg(pillars) {
    if (!pillars.day) return [];
    const dayQi = pillars.day.qi;
    const dayYun = pillars.day.yun;
    const analysis = [];

    const qiElementMap = {
        1: 'Acqua', 6: 'Acqua',
        2: 'Fuoco', 7: 'Fuoco',
        3: 'Legno', 8: 'Legno',
        4: 'Metallo', 9: 'Metallo'
    };

    Object.keys(pillars).forEach(key => {
        if (key === 'day') return;
        const p = pillars[key];
        if (!p) return;
        const pName = { year: 'Anno', month: 'Mese', hour: 'Ora' }[key];
        
        // Blood Links (HeTu Pairs: 1-6, 2-7, 3-8, 4-9)
        const pair = [dayQi, p.qi].sort().join('-');
        if (['1-6', '2-7', '3-8', '4-9'].includes(pair)) {
            const elem = qiElementMap[dayQi] || qiElementMap[p.qi] || '?';
            analysis.push(`[${pName}] HeTu Blood Link — Elemento: ${elem}`);
        }

        // Somme Gua Qi
        const sum = dayQi + p.qi;
        if ([5, 10, 15].includes(sum)) {
            analysis.push(`[${pName}] Somma XKDG: ${sum} (Qi ${dayQi} + ${p.qi})`);
        }

        // Pure Qi (Gua Yun)
        if (dayYun === p.yun) {
            analysis.push(`[${pName}] Pure Qi — Periodo Yun: ${dayYun}`);
        }
    });

    return analysis;
}

// ─────────────────────────────────────────────
//  BAZI CORE
// ─────────────────────────────────────────────
const ELEMENTS_EN = {
    '甲':'wood','乙':'wood','丙':'fire','丁':'fire','戊':'earth',
    '己':'earth','庚':'metal','辛':'metal','壬':'water','癸':'water',
    '子':'water','丑':'earth','寅':'wood','卯':'wood','辰':'earth',
    '巳':'fire','午':'fire','未':'earth','申':'metal','酉':'metal',
    '戌':'earth','亥':'water'
};

function setNow() {
    const now = new Date();
    document.getElementById('date').value = now.toISOString().split('T')[0];
    document.getElementById('time').value = now.toTimeString().slice(0,5);
    calculateBazi();
}

function getGPS() {
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition((pos) => {
            document.getElementById('longitude').value = pos.coords.longitude.toFixed(2);
            calculateBazi();
        });
    }
}

function calculateBazi() {
    const dVal = document.getElementById('date').value;
    const tVal = document.getElementById('time').value || "00:00";
    const lon  = parseFloat(document.getElementById('longitude').value);
    const utc  = parseFloat(document.getElementById('utc-offset').value);
    
    if (!dVal) return;

    // 1. True Solar Time
    const standardMeridian = utc * 15;
    const offsetMinutes = (lon - standardMeridian) * 4;
    let baseDate  = new Date(`${dVal}T${tVal}`);
    let solarDate = new Date(baseDate.getTime() + offsetMinutes * 60000);
    
    document.getElementById('solar-time-display').textContent =
        "True Solar: " + solarDate.toTimeString().slice(0,5);

    // 2. Bazi from lunar-javascript
    const solar    = Solar.fromDate(solarDate);
    const lunar    = solar.getLunar();
    const eightChar = lunar.getEightChar();

    // DAY: handle the 23:00-00:00 edge-case
    let dayGan = eightChar.getDayGan();
    let dayZhi = eightChar.getDayZhi();
    if (solarDate.getHours() === 23) {
        const yesterday = new Date(solarDate.getTime() - 3600000);
        const oldEC = Solar.fromDate(yesterday).getLunar().getEightChar();
        dayGan = oldEC.getDayGan();
        dayZhi = oldEC.getDayZhi();
    }

    // 3. Collect pillar keys (Stem+Branch) for XKDG lookup
    const pillarKeys = {
        year:  { stem: eightChar.getYearGan(),  branch: eightChar.getYearZhi()  },
        month: { stem: eightChar.getMonthGan(), branch: eightChar.getMonthZhi() },
        day:   { stem: dayGan,                  branch: dayZhi                  },
        hour:  { stem: eightChar.getTimeGan(),  branch: eightChar.getTimeZhi()  }
    };

    // 4. Get XKDG data for each pillar
    const xkdgData = {};
    Object.keys(pillarKeys).forEach(k => {
        const { stem, branch } = pillarKeys[k];
        xkdgData[k] = getXkdgData(stem, branch);
    });

    // 5. Render pillars
    updatePillar('p-year',  pillarKeys.year.stem,  pillarKeys.year.branch,  xkdgData.year);
    updatePillar('p-month', pillarKeys.month.stem, pillarKeys.month.branch, xkdgData.month);
    updatePillar('p-day',   pillarKeys.day.stem,   pillarKeys.day.branch,   xkdgData.day);
    updatePillar('p-hour',  pillarKeys.hour.stem,  pillarKeys.hour.branch,  xkdgData.hour);

    // 6. XKDG Analysis (Day as reference)
    const analysis = analyzeXkdg(xkdgData);
    renderAnalysis(analysis);
}

function updatePillar(id, stem, branch, xkdg) {
    const elS = ELEMENTS_EN[stem];
    const elB = ELEMENTS_EN[branch];
    const p   = document.getElementById(id);
    if (!p) return;

    p.querySelector('.stem').innerHTML =
        `<span class="hanzi ${elS}">${stem}</span>` +
        `<span class="element-label">- ${elS} -</span>`;

    p.querySelector('.branch').innerHTML =
        `<span class="hanzi ${elB}">${branch}</span>` +
        `<span class="element-label">- ${elB} -</span>`;

    // Build hex section from XKDG data
    let hexHTML = '';
    if (xkdg) {
        const icon    = getHexIcon(xkdg.hex);
        const hexName = `${xkdg.hex} ${HEX_NAMES[xkdg.hex] || ''}`;
        hexHTML =
            `<div class="hex-wrapper">` +
                `<div class="hex-icon">${icon}</div>` +
                `<div class="data-column">` +
                    `<div title="Gua Qi">${xkdg.qi}</div>` +
                    `<div style="font-size:11px;color:#999;" title="Jia Zi">${stem}${branch}</div>` +
                    `<div title="Gua Yun">${xkdg.yun}</div>` +
                `</div>` +
            `</div>` +
            `<div class="hex-info">${hexName}</div>`;
    } else {
        hexHTML = `<div class="hex-missing">No XKDG data<br>${stem}${branch}</div>`;
    }

    p.querySelector('.hex-section').innerHTML = hexHTML;
}

function renderAnalysis(items) {
    const section = document.getElementById('analysis-section');
    const container = document.getElementById('analysis-items');
    if (!items || items.length === 0) {
        section.style.display = 'none';
        return;
    }
    section.style.display = 'block';
    container.innerHTML = items
        .map(i => `<div class="analysis-item">⬡ ${i}</div>`)
        .join('');
}

window.onload = setNow;
</script>
</body>
</html>
